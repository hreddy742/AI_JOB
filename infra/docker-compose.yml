    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@pgbouncer:5432/apex_apply
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      PYTHONPATH: /app
    volumes:
      - ../apps/api:/app
      - ../tests:/app/tests
      - ../scripts:/app/scripts
      - bloom_data:/var/bloom
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      minio:
        condition: service_started

  campaign-worker:
    build: ../apps/api
    command: arq workers.campaign_worker.WorkerSettings
    restart: unless-stopped
    env_file:
      - ../.env.example
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@pgbouncer:5432/apex_apply
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      PYTHONPATH: /app
    volumes:
      - ../apps/api:/app
      - ../tests:/app/tests
      - ../scripts:/app/scripts
      - bloom_data:/var/bloom
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  referral-worker:
    build: ../apps/api
    command: arq workers.referral_worker.WorkerSettings
    restart: unless-stopped
    env_file:
      - ../.env.example
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@pgbouncer:5432/apex_apply
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      PYTHONPATH: /app
    volumes:
      - ../apps/api:/app
      - ../tests:/app/tests
      - ../scripts:/app/scripts
      - bloom_data:/var/bloom
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      minio:
        condition: service_started

  notification-worker:
    build: ../apps/api
    command: arq workers.notification_worker.WorkerSettings
    restart: unless-stopped
    env_file:
      - ../.env.example
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@pgbouncer:5432/apex_apply
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Apex Apply}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@apexapply.local}
      PYTHONPATH: /app
    volumes:
      - ../apps/api:/app
      - ../tests:/app/tests
      - ../scripts:/app/scripts
      - bloom_data:/var/bloom
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/apex_apply
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy

  glitchtip:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me}
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:8080
      ENABLE_USER_REGISTRATION: "False"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    command: ./bin/run-celery-with-beat.sh
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/apex_apply?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_started

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "rm -rf /app/${NEXT_DIST_DIR:-.next} /app/node_modules/.cache && npm install && npm run dev"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: /backend
      INTERNAL_API_BASE_URL: http://api:8001
      NEXT_DIST_DIR: .next-docker
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  typesense_data:
  web_node_modules:
  bloom_data:
  prometheus_data:
  loki_data:
  grafana_data:
