services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apex_apply
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apex_apply"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  typesense:
    image: typesense/typesense:0.25.1
    restart: unless-stopped
    command: "--data-dir /data --api-key=${TYPESENSE_API_KEY:-apex-apply-local-key}"
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ../apps/api
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    env_file:
      - ../.env.example
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@pgbouncer:5432/apex_apply
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Apex Apply}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@apexapply.local}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-900}
      RATE_LIMIT_REGISTER_MAX: ${RATE_LIMIT_REGISTER_MAX:-10}
      RATE_LIMIT_REGISTER_WINDOW_SECONDS: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:-3600}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-10}
      ACCOUNT_LOCKOUT_MINUTES: ${ACCOUNT_LOCKOUT_MINUTES:-15}
      ENABLE_BACKGROUND_INGESTION: "true"
      INGESTION_INTERVAL_SECONDS: 2700
      ENABLE_JOB_EMBEDDINGS: "true"
      # Source API keys are injected via env_file (../.env) so local pasted keys are used.
      PYTHONPATH: /app
    ports:
      - "8001:8001"
    volumes:
      - ../apps/api:/app
      - ../tests:/app/tests
      - ../scripts:/app/scripts
      - bloom_data:/var/bloom
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      minio:
        condition: service_started
      typesense:
        condition: service_started
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  resume-worker:
    build: ../apps/api
    command: arq workers.resume_worker.WorkerSettings
    restart: unless-stopped
    env_file:
      - ../.env.example
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@pgbouncer:5432/apex_apply
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Apex Apply}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@apexapply.local}
      PYTHONPATH: /app
    volumes:
      - ../apps/api:/app
      - ../tests:/app/tests
      - ../scripts:/app/scripts
      - bloom_data:/var/bloom
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      minio:
        condition: service_started

  tailoring-worker:
    build: ../apps/api
