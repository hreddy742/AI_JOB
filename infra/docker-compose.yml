      DATABASE_URL: postgresql+asyncpg://postgres:postgres@pgbouncer:5432/apex_apply
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-apex-apply-local-key}
      ENABLE_JOB_EMBEDDINGS: "true"
      PYTHONPATH: /app
    volumes:
      - ../apps/api:/app
      - ../tests:/app/tests
      - ../scripts:/app/scripts
      - bloom_data:/var/bloom
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
